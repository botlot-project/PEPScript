[project]
name = "pepscript"
version = "0.1.0"
description = "Typed Python library for working with PEP 723 inline script metadata"
readme = "README.md"
authors = [
    { name = "maximiliancw", email = "wunderkind.serie-0f@icloud.com" }
]
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "ruff>=0.12.0",
    "ty>=0.0.1a18",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
