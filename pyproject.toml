[project]
name = "pepscript"
version = "0.1.0"
description = "Typed Python library for working with PEP 723 inline script metadata"
readme = "README.md"
license = "MIT"
authors = [
    { name = "maximiliancw", email = "wunderkind.serie-0f@icloud.com" }
]
requires-python = ">=3.12"
dependencies = []
keywords = ["pep723", "metadata", "inline-script", "toml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/maximiliancw/pepscript"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.5",
    "mkdocstrings>=1.0.3",
    "pytest>=8.4.1",
    "ruff>=0.12.0",
    "ty>=0.0.1a18",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
